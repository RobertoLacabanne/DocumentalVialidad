# Netlify: compila la app y la publica. Las claves de Supabase van como
# variables de entorno del sitio (VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Es una app de una sola página: todas las rutas las resuelve React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las ilustraciones llevan la versión en el nombre (bajada-v1.webp): cambiar una pieza cambia el nombre.
[[headers]]
  for = "/ilustraciones/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El OCR del navegador (tesseract.js y los datos del castellano) se sirve desde la app.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# El script para traer el texto de AppUFIL se baja como texto.
[[headers]]
  for = "/herramientas/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
