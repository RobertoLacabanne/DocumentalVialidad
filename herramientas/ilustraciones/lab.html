<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratorio de ilustraciones · Tablero de Prueba</title>
    <!--
      Hoja de pruebas: pinta cada pieza de la serie a tamaño real sobre el papel de la app.
      Se abre con el servidor de desarrollo (npm run dev → /herramientas/ilustraciones/lab.html)
      o la usa scripts/ilustraciones.mjs para hornear los .webp. No es parte de la app.
      ?ver=bajada,hilo-bajada  pinta solo esas piezas (por defecto, ninguna hasta pedirla).
    -->
    <style>
      :root { --papel: #faf9f6; --tinta: #1e3350; --suave: #4a5b73; --borde: #e4e1d8; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--papel); color: var(--tinta); font: 14px/1.5 Inter, system-ui, sans-serif; }
      main { max-width: 1300px; margin: 0 auto; padding: 32px 24px 80px; display: grid; gap: 40px; }
      h1 { font: 600 28px/1.15 'Source Serif 4', Georgia, serif; margin: 0; }
      h2 { font: 600 18px/1.2 'Source Serif 4', Georgia, serif; margin: 0 0 8px; }
      p { margin: 0; color: var(--suave); }
      .pieza { display: grid; gap: 10px; }
      .marco { position: relative; display: inline-block; max-width: 100%; overflow: auto; }
      .marco canvas { display: block; }
      .sobre-blanco { background: #fff; padding: 12px; border: 1px solid var(--borde); border-radius: 12px; }
      .capas canvas + canvas { position: absolute; inset: 0; }
      .muestras { display: flex; flex-wrap: wrap; gap: 14px; }
      .muestra { width: 132px; font-size: 12px; }
      .muestra i { display: block; height: 44px; border-radius: 6px; border: 1px solid var(--borde); margin-bottom: 4px; }
      .cmp { display: flex; gap: 0; border-radius: 8px; overflow: hidden; width: 320px; height: 64px; border: 1px solid var(--borde); }
      .cmp span { flex: 1; display: grid; place-items: center; font: 600 12px Inter, sans-serif; color: #fff; }
      #estado { font: 12px ui-monospace, monospace; color: var(--suave); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Laboratorio de ilustraciones</h1>
        <p>Acuarela procedural sobre el papel de la app. Cada pieza se pinta con una semilla fija.</p>
        <p id="estado">Nada pintado todavía. Usá ?ver=bajada</p>
      </header>
      <section>
        <h2>Pigmentos</h2>
        <div class="muestras" id="muestras"></div>
      </section>
      <section>
        <h2>El punzó del hilo frente al lacre de las alertas procesales</h2>
        <div class="cmp" id="cmp"></div>
        <p id="cmpTexto"></p>
      </section>
      <section id="piezas"></section>
    </main>
    <script type="module">
      import { PIEZAS } from './piezas/index.js';
      import { PIGMENTOS } from './pigmentos.js';
      import { Lienzo } from './acuarela.js';

      const estado = document.getElementById('estado');
      const cache = new Map();

      // Muestras de pigmento
      const muestras = document.getElementById('muestras');
      for (const p of Object.values(PIGMENTOS)) {
        const d = document.createElement('div');
        d.className = 'muestra';
        d.innerHTML = `<i style="background:${p.hex}"></i><b>${p.nombre}</b><br>${p.hex}`;
        muestras.appendChild(d);
      }

      // Distancia entre el punzó y el lacre (CIE76 en Lab)
      const aLab = (hex) => {
        const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
        const X = (c[0] * 0.4124 + c[1] * 0.3576 + c[2] * 0.1805) / 0.95047;
        const Y = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
        const Z = (c[0] * 0.0193 + c[1] * 0.1192 + c[2] * 0.9505) / 1.08883;
        const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
        return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
      };
      const hue = (l) => ((Math.atan2(l[2], l[1]) * 180) / Math.PI + 360) % 360;
      const lacre = '#A63D2A';
      const punzo = PIGMENTOS.punzo.hex;
      const la = aLab(lacre);
      const pa = aLab(punzo);
      const dE = Math.hypot(la[0] - pa[0], la[1] - pa[1], la[2] - pa[2]);
      document.getElementById('cmp').innerHTML = `<span style="background:${lacre}">lacre ${lacre}</span><span style="background:${punzo}">punzó ${punzo}</span>`;
      document.getElementById('cmpTexto').textContent = `ΔE (CIE76) = ${dE.toFixed(1)}; matiz del lacre ${hue(la).toFixed(0)}°, del punzó ${hue(pa).toFixed(0)}°. Son pigmentos a densidad plena: en el hilo, con veladuras, el punzó queda más claro y más frío.`;
      window.__comparacion = { dE, matizLacre: hue(la), matizPunzo: hue(pa) };

      function pintar(id) {
        if (cache.has(id)) return cache.get(id);
        const def = PIEZAS.find((p) => p.id === id);
        if (!def) throw new Error('No existe la pieza ' + id);
        const t0 = performance.now();
        const L = new Lienzo(def.ancho, def.alto, { escala: 2, modo: def.modo, semilla: def.semilla });
        def.pintar(L);
        const cv = L.aCanvas();
        const r = { def, cv, ms: Math.round(performance.now() - t0) };
        cache.set(id, r);
        return r;
      }

      const codificar = (cv, q) => cv.toDataURL('image/webp', q);
      const bytes = (url) => Math.floor(((url.length - url.indexOf(',') - 1) * 3) / 4);

      function a1x(cv, w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(cv, 0, 0, w, h);
        return c;
      }

      // Hornea una pieza: devuelve el .webp a 1x y a 2x. A 1x baja la calidad hasta entrar en el presupuesto.
      window.hornear = async (id) => {
        const { def, cv, ms } = pintar(id);
        const c1 = a1x(cv, def.ancho, def.alto);
        let q = 0.9;
        let u1 = codificar(c1, q);
        while (bytes(u1) > def.presupuesto && q > 0.4) {
          q -= 0.06;
          u1 = codificar(c1, q);
        }
        const u2 = codificar(cv, Math.max(0.4, q - 0.08));
        // Vista previa: la pieza sobre el papel de la app
        const p = document.createElement('canvas');
        p.width = cv.width;
        p.height = cv.height;
        const pc = p.getContext('2d');
        pc.fillStyle = '#faf9f6';
        pc.fillRect(0, 0, p.width, p.height);
        pc.drawImage(cv, 0, 0);
        return { id, version: def.version, ancho: def.ancho, alto: def.alto, calidad: q, ms, x1: u1, x2: u2, b1: bytes(u1), b2: bytes(u2), previa: p.toDataURL('image/png') };
      };
      window.compuesta = async (ids) => {
        const primero = pintar(ids[0]);
        const p = document.createElement('canvas');
        p.width = primero.cv.width;
        p.height = primero.cv.height;
        const pc = p.getContext('2d');
        pc.fillStyle = '#faf9f6';
        pc.fillRect(0, 0, p.width, p.height);
        for (const id of ids) pc.drawImage(pintar(id).cv, 0, 0);
        return p.toDataURL('image/png');
      };
      window.entrecerrada = async (ids) => {
        const primero = pintar(ids[0]);
        const w = Math.round(primero.cv.width / 5);
        const h = Math.round(primero.cv.height / 5);
        const base = document.createElement('canvas');
        base.width = primero.cv.width;
        base.height = primero.cv.height;
        const bc = base.getContext('2d');
        bc.fillStyle = '#faf9f6';
        bc.fillRect(0, 0, base.width, base.height);
        for (const id of ids) bc.drawImage(pintar(id).cv, 0, 0);
        const p = document.createElement('canvas');
        p.width = w;
        p.height = h;
        const pc = p.getContext('2d');
        pc.filter = 'blur(2.5px) grayscale(1)';
        pc.drawImage(base, 0, 0, w, h);
        return p.toDataURL('image/png');
      };
      window.pintarId = async (id) => { pintar(id); return true; };
      window.PIEZAS_IDS = PIEZAS.map((p) => p.id);

      // Vista en pantalla
      const ver = new URLSearchParams(location.search).get('ver');
      if (ver) {
        const cont = document.getElementById('piezas');
        for (const id of ver.split(',')) {
          estado.textContent = `Pintando ${id}…`;
          await new Promise((r) => setTimeout(r));
          const { def, cv, ms } = pintar(id);
          const sec = document.createElement('div');
          sec.className = 'pieza';
          sec.innerHTML = `<h2>${id} <small style="font-weight:400;color:#667387">v${def.version} · ${def.ancho}×${def.alto} · ${ms} ms</small></h2><p>${def.uso}</p>`;
          const marco = document.createElement('div');
          marco.className = 'marco';
          cv.style.width = def.ancho + 'px';
          cv.style.height = def.alto + 'px';
          marco.appendChild(cv);
          sec.appendChild(marco);
          cont.appendChild(sec);
        }
        estado.textContent = 'Listo.';
      }
    </script>
  </body>
</html>
